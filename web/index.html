<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app runs under the iPhone status bar / home indicator; CSS pads with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%SHARE_TITLE%</title>
    <meta name="description" content="%SHARE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- How a shared link looks (WhatsApp, Instagram, Telegram, X, iMessage). Values come from
         src/lib/site.ts; the image is made by `npm run share-kit` and must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vilanova Surf" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SHARE_TITLE%" />
    <meta property="og:description" content="%SHARE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vilanova Surf: a wave and the words: How were the waves today? Rate them and help train a better forecast." />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#031b26" />
    <meta name="color-scheme" content="dark" />

    <!-- Installable app (Android/desktop read the manifest; iPhone reads the apple-* tags). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Surf" />

    <!-- Fonts are self-hosted (public/fonts). -->
    <!-- Only the headline font is preloaded; the body font swaps in, so it doesn't compete with the JavaScript. -->
    <link rel="preload" href="/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open the data connections while the JavaScript is still downloading. -->
    <link rel="preconnect" href="https://marine-api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- Paints before any JavaScript runs, so the screen is never blank. -->
    <style>
      html,
      body {
        margin: 0;
        background: #031b26;
        color: #e6f2ee;
      }
      .boot {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        font: 800 3rem/1 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
        color: #8fb3bc;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Checking the sea…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
