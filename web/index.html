<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app runs under the iPhone status bar / home indicator; CSS pads with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vilanova surf</title>
    <meta
      name="description"
      content="Surf forecast for Platja de Vilanova i la Geltrú: a 1-5 score for every hour, corrected every night by what surfers report."
    />
    <meta name="theme-color" content="#031b26" />
    <meta name="color-scheme" content="dark" />

    <!-- Installable app (Android/desktop read the manifest; iPhone reads the apple-* tags). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Surf" />

    <!-- Fonts are self-hosted (public/fonts). -->
    <!-- Only the headline font is preloaded; the body font swaps in, so it doesn't compete with the JavaScript. -->
    <link rel="preload" href="/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open the data connections while the JavaScript is still downloading. -->
    <link rel="preconnect" href="https://marine-api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- Paints before any JavaScript runs, so the screen is never blank. -->
    <style>
      html,
      body {
        margin: 0;
        background: #031b26;
        color: #e6f2ee;
      }
      .boot {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        font: 800 3rem/1 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
        color: #8fb3bc;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Checking the sea…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
